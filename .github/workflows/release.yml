name: Build Lotion downloads

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-downloads-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  package-macos:
    name: Package macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Package Lotion
        run: npm run package:mac -- --${{ matrix.arch }}

      - name: Verify the packaged app starts
        run: npm run package:mac:verify -- --arch ${{ matrix.arch }}

      - name: Create architecture checksums
        working-directory: artifacts/production-release
        run: shasum -a 256 Lotion-*-${{ matrix.arch }}.dmg Lotion-*-${{ matrix.arch }}.zip > SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload macOS downloads
        uses: actions/upload-artifact@v4
        with:
          name: Lotion-macOS-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/production-release/Lotion-*-${{ matrix.arch }}.dmg
            artifacts/production-release/Lotion-*-${{ matrix.arch }}.zip
            artifacts/production-release/SHA256SUMS-${{ matrix.arch }}.txt

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: Lotion-macOS-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Create combined checksums
        working-directory: release
        run: sha256sum Lotion-*.dmg Lotion-*.zip > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt --verify-tag --generate-notes --title "Lotion $GITHUB_REF_NAME"
          fi
